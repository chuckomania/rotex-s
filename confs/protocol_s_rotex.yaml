# Rotex / Daikin Protokoll S
# Zuordnung übernommen aus ESPAltherma include/def/PROTOCOL_S_ROTEX.h
# (dort bestätigt für Rotex RDLQ014AA6V3). Offsets zählen ab dem Byte nach
# dem Register-Byte, genau wie in ESPAltherma.
# Antwortlängen: 0x50 -> 6, 0x56 -> 4, sonst 18 Bytes (siehe altherma_hub.cpp).

sensor:
  # --- Register 0x54: Temperaturen (Konverter 153 = unsigned / 256) ---
  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Kältemittel flüssig"
    register: 0x54
    offset: 0
    convid: 153
    datasize: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Rücklauftemperatur"
    register: 0x54
    offset: 2
    convid: 153
    datasize: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Vorlauftemperatur"
    register: 0x54
    offset: 4
    convid: 153
    datasize: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Temperatur D (unbekannt)"
    register: 0x54
    offset: 6
    convid: 153
    datasize: 2
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Speichertemperatur (DHW)"
    register: 0x54
    offset: 8
    convid: 153
    datasize: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  # Vorzeichenbehaftet (103), evtl. Außentemperatur - noch unbestätigt
  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Temperatur F (unbekannt)"
    register: 0x54
    offset: 10
    convid: 103
    datasize: 2
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic

  # Bedeutung unklar (ESPAltherma: Delta-T). Wert 26 bei Vorlauf 27,4 °C -
  # evtl. Vorlauf-Sollwert. Mit Anzeige an der Anlage abgleichen.
  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "0x54 Byte 12"
    register: 0x54
    offset: 12
    convid: 101
    datasize: 1
    state_class: measurement
    entity_category: diagnostic

  # Bedeutung unklar (ESPAltherma: Sollwert Regler), bisher immer 0.
  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "0x54 Byte 13"
    register: 0x54
    offset: 13
    convid: 151
    datasize: 1
    state_class: measurement
    entity_category: diagnostic

  # --- Register 0x56: Bedeutung unbekannt (laut ESPAltherma "????") ---
  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Register 0x56 (unbekannt)"
    register: 0x56
    offset: 0
    convid: 103
    datasize: 2
    state_class: measurement
    entity_category: diagnostic

binary_sensor:
  # --- Register 0x53: Schaltzustände (Konverter 200 = ON/OFF) ---
  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Umwälzpumpe"
    register: 0x53
    offset: 0
    convid: 200
    datasize: 1

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Zusatzheizung"
    register: 0x53
    offset: 3
    convid: 200
    datasize: 1

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Vorrang Warmwasser"
    register: 0x53
    offset: 5
    convid: 200
    datasize: 1

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    name: "Brennersperre Solaris"
    register: 0x53
    offset: 6
    convid: 200
    datasize: 1

