substitutions:
  # Modell aus dem confs/ Ordner wählen (ohne .yaml):
  altherma_model: protocol_s_rotex
  altherma_component_source: components

esphome:
  name: rotex-hpsu
  friendly_name: Rotex HPSU 508
  name_add_mac_suffix: false

api:
  reboot_timeout: 0s

logger:

# Webserver für direkten Browser-Zugriff über die IP-Adresse
web_server:
  port: 80

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESPHome-Altherma-Fallback"

captive_portal:

uart:
  id: uart_bus
  tx_pin: D1
  rx_pin: D2
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  debug:
    direction: BOTH

external_components:
  - source: ${altherma_component_source}
    components: [altherma_hub]
    refresh: always    

altherma_hub:
  id: altherma_hub_1
  uart_id: uart_bus
  update_interval: 30s
  query_result_text_sensor: query_registry_result


text_sensor:
  - platform: template
    name: "Manual Query Registry Result"
    id: query_registry_result
    entity_category: diagnostic

mqtt:
  broker: 192.168.178.60
  port: 1880
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: rotex-hpsu

packages:
  altherma_sensors: !include confs/protocol_s_rotex.yaml
  # common_diagnostics: !include common/diagnostics.yaml